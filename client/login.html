<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wansa - تسجيل الدخول</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #075E54 0%, #128C7E 50%, #25D366 100%); padding: 20px; }
    .container { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 420px; padding: 40px 30px; }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #25D366, #128C7E); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 40px; color: white; margin-bottom: 10px; }
    .logo h1 { color: #075E54; font-size: 32px; }
    .logo p { color: #667781; font-size: 14px; margin-top: 5px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 8px; color: #075E54; font-weight: 600; font-size: 14px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .form-group input { width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; background: #f9fafb; transition: all 0.3s; }
    .form-group input:focus { outline: none; border-color: #25D366; background: #fff; }
    .form-group input.password-input { padding-left: 48px; }
    .toggle-password { position: absolute; left: 12px; background: none; border: none; cursor: pointer; font-size: 20px; padding: 5px; }
    .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn:disabled { opacity: 0.6; }
    .link { text-align: center; margin-top: 20px; color: #667781; font-size: 14px; }
    .link a { color: #25D366; text-decoration: none; font-weight: 700; }
    .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; border-right: 4px solid #dc2626; }
    .error.show { display: block; }
    .success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; border-right: 4px solid #10b981; }
    .success.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <h1>Wansa</h1>
      <p>تطبيق المحادثة الفورية</p>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="login">البريد الإلكتروني أو رقم الهاتف</label>
        <input type="text" id="login" placeholder="example@wansa.com أو +249123456789" required>
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="password-input" placeholder="••••••••" required>
          <button type="button" class="toggle-password" id="togglePassword">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn" id="submitBtn">تسجيل الدخول</button>
    </form>

    <div class="link">ليس لديك حساب؟ <a href="/register.html">أنشئ حساباً جديداً</a></div>
  </div>

<script>
  const API_URL = window.location.origin;
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const submitBtn = document.getElementById('submitBtn');
  const passwordInput = document.getElementById('password');

  if (localStorage.getItem('token')) window.location.href = '/index.html';

  document.getElementById('togglePassword').addEventListener('click', (e) => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      e.target.textContent = '🙈';
    } else {
      passwordInput.type = 'password';
      e.target.textContent = '👁️';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');

    const login = document.getElementById('login').value.trim();
    const password = passwordInput.value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الدخول...';

    try {
      const res = await fetch(`${API_URL}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'فشل الدخول');

      localStorage.setItem('token', data.token);
      localStorage.setItem('userId', data.user._id);
      localStorage.setItem('username', data.user.username);
      localStorage.setItem('userEmail', data.user.email || '');
      localStorage.setItem('userPhone', data.user.phone || '');

      showSuccess('✅ تم الدخول!');
      setTimeout(() => window.location.href = '/index.html', 800);

    } catch (err) {
      errorBox.textContent = '⚠️ ' + err.message;
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'تسجيل الدخول';
    }
  });

  function showSuccess(msg) {
    successBox.textContent = msg;
    successBox.classList.add('show');
  }
</script>
</body>
</html>
