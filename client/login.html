<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wansa - تسجيل الدخول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #075E54 0%, #128C7E 50%, #25D366 100%);
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo-icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
      margin-bottom: 10px;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4); }
      50% { box-shadow: 0 8px 30px rgba(37, 211, 102, 0.7); }
    }
    .logo h1 { color: #075E54; font-size: 32px; letter-spacing: 1px; }
    .logo p { color: #667781; font-size: 14px; margin-top: 5px; }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #075E54;
      font-weight: 600;
      font-size: 14px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s;
      background: #f9fafb;
    }
    .form-group input:focus {
      outline: none;
      border-color: #25D366;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.15);
    }
    /* حقل كلمة المرور مع زر العين */
    .form-group input.password-input {
      padding-left: 48px;
    }
    .toggle-password {
      position: absolute;
      left: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      padding: 5px;
      opacity: 0.6;
      transition: opacity 0.3s;
      line-height: 1;
    }
    .toggle-password:hover { opacity: 1; }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .link { text-align: center; margin-top: 20px; color: #667781; font-size: 14px; }
    .link a { color: #25D366; text-decoration: none; font-weight: 700; }
    .link a:hover { text-decoration: underline; }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
      border-right: 4px solid #dc2626;
      animation: shake 0.4s;
    }
    .error.show { display: block; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .success {
      background: #d1fae5;
      color: #065f46;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
      border-right: 4px solid #10b981;
    }
    .success.show { display: block; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <h1>Wansa</h1>
      <p>تطبيق المحادثة الفورية</p>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="example@wansa.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="password-input" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePassword" title="إظهار كلمة المرور">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span id="btnText">تسجيل الدخول</span>
      </button>
    </form>

    <div class="link">
      ليس لديك حساب؟ <a href="/register.html">أنشئ حساباً جديداً</a>
    </div>
  </div>

<script>
  const API_URL = window.location.origin;
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const passwordInput = document.getElementById('password');
  const togglePassword = document.getElementById('togglePassword');

  // إذا كان مسجل دخول بالفعل
  if (localStorage.getItem('token')) {
    window.location.href = '/index.html';
  }

  // 👁️ إظهار/إخفاء كلمة المرور
  togglePassword.addEventListener('click', () => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      togglePassword.textContent = '🙈';
      togglePassword.title = 'إخفاء كلمة المرور';
    } else {
      passwordInput.type = 'password';
      togglePassword.textContent = '👁️';
      togglePassword.title = 'إظهار كلمة المرور';
    }
    passwordInput.focus();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    successBox.classList.remove('show');

    const email = document.getElementById('email').value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showError('الرجاء إدخال البريد وكلمة المرور');
      return;
    }

    submitBtn.disabled = true;
    btnText.innerHTML = 'جاري الدخول... <span class="spinner"></span>';

    try {
      const res = await fetch(`${API_URL}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'فشل تسجيل الدخول');
      }

      // حفظ البيانات
      localStorage.setItem('token', data.token);
      localStorage.setItem('userId', data.user._id);
      localStorage.setItem('username', data.user.username);
      localStorage.setItem('userEmail', data.user.email);

      // عرض رسالة نجاح
      showSuccess('✅ تم تسجيل الدخول بنجاح! جاري التحويل...');

      // الانتقال بعد 800ms
      setTimeout(() => {
        window.location.href = '/index.html';
      }, 800);

    } catch (err) {
      showError(err.message);
      submitBtn.disabled = false;
      btnText.textContent = 'تسجيل الدخول';
    }
  });

  function showError(msg) {
    errorBox.textContent = '⚠️ ' + msg;
    errorBox.classList.add('show');
    successBox.classList.remove('show');
  }

  function showSuccess(msg) {
    successBox.textContent = msg;
    successBox.classList.add('show');
    errorBox.classList.remove('show');
  }
</script>
</body>
</html>
