<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wansa - إنشاء حساب</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #075E54 0%, #128C7E 50%, #25D366 100%); padding: 20px; }
    .container { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 460px; padding: 30px; animation: slideUp 0.5s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #25D366, #128C7E); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 35px; color: white; margin-bottom: 10px; box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4); }
    .logo h1 { color: #075E54; font-size: 28px; }
    .logo p { color: #667781; font-size: 13px; margin-top: 5px; }

    .tabs { display: flex; background: #f0f2f5; border-radius: 10px; padding: 4px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; font-weight: 600; font-size: 14px; color: #667781; transition: all 0.2s; }
    .tab.active { background: #fff; color: #075E54; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; color: #075E54; font-weight: 600; font-size: 13px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .form-group input { width: 100%; padding: 13px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; background: #f9fafb; transition: all 0.3s; }
    .form-group input:focus { outline: none; border-color: #25D366; background: #fff; box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.15); }
    .form-group input.password-input { padding-left: 48px; }

    .toggle-password { position: absolute; left: 12px; background: none; border: none; cursor: pointer; font-size: 20px; padding: 5px; opacity: 0.6; }
    
    .hint { font-size: 12px; color: #667781; margin-top: 5px; display: none; }
    .hint.show { display: block; }
    .hint.error { color: #dc2626; }
    .hint.success { color: #10b981; }

    .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .link { text-align: center; margin-top: 15px; color: #667781; font-size: 14px; }
    .link a { color: #25D366; text-decoration: none; font-weight: 700; }

    .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; border-right: 4px solid #dc2626; }
    .error.show { display: block; }
    .success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; border-right: 4px solid #10b981; }
    .success.show { display: block; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-left: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .strength-bar { height: 4px; background: #e5e7eb; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; width: 0; transition: all 0.3s; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <h1>Wansa</h1>
      <p>أنشئ حساباً جديداً</p>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" placeholder="مثال: أحمد" required minlength="3" maxlength="30">
        <div class="hint" id="usernameHint">3-30 حرفاً (عربي أو إنجليزي)</div>
      </div>

      <!-- التبويبات للبريد / الهاتف -->
      <div class="tabs">
        <div class="tab active" id="tabEmail" onclick="switchTab('email')">📧 البريد الإلكتروني</div>
        <div class="tab" id="tabPhone" onclick="switchTab('phone')">📱 رقم الهاتف</div>
      </div>

      <div class="form-group" id="emailGroup">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@wansa.com">
      </div>

      <div class="form-group" id="phoneGroup" style="display: none;">
        <label for="phone">رقم الهاتف</label>
        <input type="tel" id="phone" placeholder="+249123456789">
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="password-input" placeholder="••••••••" required minlength="6">
          <button type="button" class="toggle-password" id="togglePassword">👁️</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="hint" id="passwordHint">6 أحرف على الأقل</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" class="password-input" placeholder="••••••••" required>
          <button type="button" class="toggle-password" id="toggleConfirm">👁️</button>
        </div>
        <div class="hint" id="confirmHint"></div>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span id="btnText">إنشاء الحساب</span>
      </button>
    </form>

    <div class="link">
      لديك حساب بالفعل؟ <a href="/login.html">سجّل الدخول</a>
    </div>
  </div>

<script>
  const API_URL = window.location.origin;
  const form = document.getElementById('registerForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');

  let currentTab = 'email'; // email or phone

  // التبديل بين البريد والهاتف
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabEmail').classList.toggle('active', tab === 'email');
    document.getElementById('tabPhone').classList.toggle('active', tab === 'phone');
    document.getElementById('emailGroup').style.display = tab === 'email' ? 'block' : 'none';
    document.getElementById('phoneGroup').style.display = tab === 'phone' ? 'block' : 'none';
  }

  // إظهار/إخفاء كلمات المرور
  function setupToggle(btnId, inputEl) {
    document.getElementById(btnId).addEventListener('click', (e) => {
      const btn = e.target;
      if (inputEl.type === 'password') {
        inputEl.type = 'text';
        btn.textContent = '🙈';
      } else {
        inputEl.type = 'password';
        btn.textContent = '👁️';
      }
    });
  }
  setupToggle('togglePassword', document.getElementById('password'));
  setupToggle('toggleConfirm', document.getElementById('confirmPassword'));

  // قوة كلمة المرور
  document.getElementById('password').addEventListener('input', (e) => {
    const val = e.target.value;
    const strengthFill = document.getElementById('strengthFill');
    const hint = document.getElementById('passwordHint');
    let strength = 0;
    if (val.length >= 6) strength++;
    if (val.length >= 8) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    
    const percent = Math.min(strength * 20, 100);
    strengthFill.style.width = percent + '%';
    strengthFill.style.background = strength <= 1 ? '#dc2626' : (strength <= 3 ? '#f59e0b' : '#10b981');
  });

  // تطابق كلمة المرور
  document.getElementById('confirmPassword').addEventListener('input', (e) => {
    const hint = document.getElementById('confirmHint');
    if (e.target.value === document.getElementById('password').value) {
      hint.textContent = '✅ متطابقتان';
      hint.className = 'hint show success';
    } else {
      hint.textContent = '❌ غير متطابقتين';
      hint.className = 'hint show error';
    }
  });

  // إرسال النموذج
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (!username || !password) return showError('جميع الحقول مطلوبة');
    if (currentTab === 'email' && !email) return showError('البريد الإلكتروني مطلوب');
    if (currentTab === 'phone' && !phone) return showError('رقم الهاتف مطلوب');
    if (password !== confirm) return showError('كلمتا المرور غير متطابقتين');

    submitBtn.disabled = true;
    btnText.innerHTML = 'جاري الإنشاء... <span class="spinner"></span>';

    try {
      const res = await fetch(`${API_URL}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username,
          email: currentTab === 'email' ? email : null,
          phone: currentTab === 'phone' ? phone : null,
          password
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'فشل إنشاء الحساب');

      localStorage.setItem('token', data.token);
      localStorage.setItem('userId', data.user._id);
      localStorage.setItem('username', data.user.username);
      localStorage.setItem('userEmail', data.user.email || '');
      localStorage.setItem('userPhone', data.user.phone || '');

      showSuccess('🎉 تم إنشاء حسابك بنجاح!');
      setTimeout(() => window.location.href = '/index.html', 1200);

    } catch (err) {
      showError(err.message);
      submitBtn.disabled = false;
      btnText.textContent = 'إنشاء الحساب';
    }
  });

  function showError(msg) {
    errorBox.textContent = '⚠️ ' + msg;
    errorBox.classList.add('show');
    successBox.classList.remove('show');
  }
  function showSuccess(msg) {
    successBox.textContent = msg;
    successBox.classList.add('show');
    errorBox.classList.remove('show');
  }
</script>
</body>
</html>
