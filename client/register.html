<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wansa - إنشاء حساب</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #075E54 0%, #128C7E 50%, #25D366 100%);
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 440px;
      padding: 35px 30px;
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { text-align: center; margin-bottom: 25px; }
    .logo-icon {
      width: 75px; height: 75px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: white;
      margin-bottom: 10px;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
    }
    .logo h1 { color: #075E54; font-size: 30px; letter-spacing: 1px; }
    .logo p { color: #667781; font-size: 14px; margin-top: 5px; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #075E54;
      font-weight: 600;
      font-size: 14px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s;
      background: #f9fafb;
    }
    .form-group input:focus {
      outline: none;
      border-color: #25D366;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.15);
    }
    .form-group input.password-input { padding-left: 48px; }
    .form-group input.invalid { border-color: #dc2626; background: #fef2f2; }
    .form-group input.valid { border-color: #10b981; }

    .toggle-password {
      position: absolute;
      left: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      padding: 5px;
      opacity: 0.6;
      transition: opacity 0.3s;
    }
    .toggle-password:hover { opacity: 1; }

    .hint {
      font-size: 12px;
      color: #667781;
      margin-top: 5px;
      display: none;
    }
    .hint.show { display: block; }
    .hint.error { color: #dc2626; }
    .hint.success { color: #10b981; }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .link { text-align: center; margin-top: 18px; color: #667781; font-size: 14px; }
    .link a { color: #25D366; text-decoration: none; font-weight: 700; }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
      border-right: 4px solid #dc2626;
    }
    .error.show { display: block; }

    .success {
      background: #d1fae5;
      color: #065f46;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
      border-right: 4px solid #10b981;
    }
    .success.show { display: block; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .strength-bar {
      height: 4px;
      background: #e5e7eb;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0;
      transition: all 0.3s;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <h1>Wansa</h1>
      <p>أنشئ حساباً جديداً</p>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <div class="input-wrapper">
          <input type="text" id="username" placeholder="مثال: أحمد أو ahmed" required autocomplete="username" minlength="3" maxlength="30">
        </div>
        <div class="hint" id="usernameHint">3-30 حرفاً (عربي أو إنجليزي أو أرقام)</div>
      </div>

      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="example@wansa.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="password-input" placeholder="••••••••" required autocomplete="new-password" minlength="6">
          <button type="button" class="toggle-password" id="togglePassword">👁️</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="hint" id="passwordHint">6 أحرف على الأقل</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" class="password-input" placeholder="••••••••" required autocomplete="new-password">
          <button type="button" class="toggle-password" id="toggleConfirm">👁️</button>
        </div>
        <div class="hint" id="confirmHint"></div>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span id="btnText">إنشاء الحساب</span>
      </button>
    </form>

    <div class="link">
      لديك حساب بالفعل؟ <a href="/login.html">سجّل الدخول</a>
    </div>
  </div>

<script>
  const API_URL = window.location.origin;
  const form = document.getElementById('registerForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');

  const usernameInput = document.getElementById('username');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');

  const usernameHint = document.getElementById('usernameHint');
  const passwordHint = document.getElementById('passwordHint');
  const confirmHint = document.getElementById('confirmHint');
  const strengthFill = document.getElementById('strengthFill');

  if (localStorage.getItem('token')) {
    window.location.href = '/index.html';
  }

  // إظهار/إخفاء كلمات المرور
  function setupToggle(btnId, inputEl) {
    document.getElementById(btnId).addEventListener('click', (e) => {
      const btn = e.target;
      if (inputEl.type === 'password') {
        inputEl.type = 'text';
        btn.textContent = '🙈';
      } else {
        inputEl.type = 'password';
        btn.textContent = '👁️';
      }
      inputEl.focus();
    });
  }
  setupToggle('togglePassword', passwordInput);
  setupToggle('toggleConfirm', confirmInput);

  // التحقق من اسم المستخدم (يدعم العربية)
  usernameInput.addEventListener('input', () => {
    const val = usernameInput.value.trim();
    if (val.length === 0) {
      usernameHint.classList.remove('show');
      usernameInput.classList.remove('invalid', 'valid');
      return;
    }
    usernameHint.classList.add('show');
    if (val.length < 3) {
      usernameInput.classList.add('invalid');
      usernameInput.classList.remove('valid');
      usernameHint.className = 'hint show error';
      usernameHint.textContent = '❌ اسم المستخدم قصير جداً (3 أحرف على الأقل)';
    } else if (!/^[\u0600-\u06FFa-zA-Z0-9_\s]+$/.test(val)) {
      usernameInput.classList.add('invalid');
      usernameInput.classList.remove('valid');
      usernameHint.className = 'hint show error';
      usernameHint.textContent = '❌ يُسمح بالعربية والإنجليزية والأرقام و _ فقط';
    } else {
      usernameInput.classList.remove('invalid');
      usernameInput.classList.add('valid');
      usernameHint.className = 'hint show success';
      usernameHint.textContent = '✅ اسم المستخدم صالح';
    }
  });

  // قوة كلمة المرور
  passwordInput.addEventListener('input', () => {
    const val = passwordInput.value;
    let strength = 0;
    if (val.length >= 6) strength++;
    if (val.length >= 8) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;

    const percent = Math.min(strength * 20, 100);
    strengthFill.style.width = percent + '%';

    if (strength <= 1) {
      strengthFill.style.background = '#dc2626';
      passwordHint.className = 'hint show error';
      passwordHint.textContent = 'ضعيفة جداً';
    } else if (strength <= 3) {
      strengthFill.style.background = '#f59e0b';
      passwordHint.className = 'hint show';
      passwordHint.textContent = 'متوسطة';
    } else {
      strengthFill.style.background = '#10b981';
      passwordHint.className = 'hint show success';
      passwordHint.textContent = 'قوية 💪';
    }
  });

  // تطابق كلمة المرور
  confirmInput.addEventListener('input', () => {
    if (!confirmInput.value) {
      confirmHint.classList.remove('show');
      return;
    }
    confirmHint.classList.add('show');
    if (confirmInput.value === passwordInput.value) {
      confirmInput.classList.remove('invalid');
      confirmInput.classList.add('valid');
      confirmHint.className = 'hint show success';
      confirmHint.textContent = '✅ كلمتا المرور متطابقتان';
    } else {
      confirmInput.classList.add('invalid');
      confirmInput.classList.remove('valid');
      confirmHint.className = 'hint show error';
      confirmHint.textContent = '❌ كلمتا المرور غير متطابقتين';
    }
  });

  // الإرسال
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    successBox.classList.remove('show');

    const username = usernameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!username || !email || !password) return showError('جميع الحقول مطلوبة');
    if (username.length < 3) return showError('اسم المستخدم قصير جداً');
    if (!/^[\u0600-\u06FFa-zA-Z0-9_\s]+$/.test(username)) {
      return showError('اسم المستخدم يحتوي على رموز غير مسموحة');
    }
    if (password.length < 6) return showError('كلمة المرور قصيرة جداً');
    if (password !== confirmInput.value) return showError('كلمتا المرور غير متطابقتين');

    submitBtn.disabled = true;
    btnText.innerHTML = 'جاري الإنشاء... <span class="spinner"></span>';

    try {
      const res = await fetch(`${API_URL}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'فشل إنشاء الحساب');

      localStorage.setItem('token', data.token);
      localStorage.setItem('userId', data.user._id);
      localStorage.setItem('username', data.user.username);
      localStorage.setItem('userEmail', data.user.email);

      showSuccess('🎉 تم إنشاء حسابك بنجاح! جاري التحويل...');

      setTimeout(() => {
        window.location.href = '/index.html';
      }, 1200);

    } catch (err) {
      showError(err.message);
      submitBtn.disabled = false;
      btnText.textContent = 'إنشاء الحساب';
    }
  });

  function showError(msg) {
    errorBox.textContent = '⚠️ ' + msg;
    errorBox.classList.add('show');
    successBox.classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showSuccess(msg) {
    successBox.textContent = msg;
    successBox.classList.add('show');
    errorBox.classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
