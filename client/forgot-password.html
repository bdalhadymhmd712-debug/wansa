<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wansa - استعادة كلمة المرور</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #075E54 0%, #128C7E 50%, #25D366 100%); padding: 20px; }
    .container { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 440px; padding: 35px 30px; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #25D366, #128C7E); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 35px; color: white; margin-bottom: 10px; }
    .logo h1 { color: #075E54; font-size: 26px; }
    .logo p { color: #667781; font-size: 13px; margin-top: 5px; }
    
    .step { display: none; }
    .step.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; color: #075E54; font-weight: 600; font-size: 14px; }
    .form-group input { width: 100%; padding: 13px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; background: #f9fafb; transition: all 0.3s; }
    .form-group input:focus { outline: none; border-color: #25D366; background: #fff; }
    
    .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn:disabled { opacity: 0.6; }
    
    .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; border-right: 4px solid #dc2626; }
    .error.show { display: block; }
    .success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; border-right: 4px solid #10b981; }
    .success.show { display: block; }
    
    .link { text-align: center; margin-top: 15px; font-size: 14px; }
    .link a { color: #25D366; font-weight: 700; text-decoration: none; }
    .otp-input { text-align: center; letter-spacing: 10px; font-size: 24px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">🔑</div>
      <h1>استعادة كلمة المرور</h1>
      <p>Wansa</p>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <!-- الخطوة 1: طلب البريد أو الهاتف -->
    <div class="step active" id="step1">
      <div class="form-group">
        <label for="identifier">البريد الإلكتروني أو رقم الهاتف</label>
        <input type="text" id="identifier" placeholder="example@wansa.com أو +249123456789">
      </div>
      <button class="btn" id="sendCodeBtn">إرسال كود التحقق</button>
      <div class="link"><a href="/login.html">العودة لتسجيل الدخول</a></div>
    </div>

    <!-- الخطوة 2: إدخال الكود -->
    <div class="step" id="step2">
      <div class="form-group">
        <label for="code">أدخل كود التحقق (6 أرقام)</label>
        <input type="text" id="code" class="otp-input" maxlength="6" placeholder="000000">
      </div>
      <button class="btn" id="verifyBtn">التحقق</button>
      <div class="link"><a href="#" id="resendBtn">إعادة إرسال الكود</a></div>
    </div>

    <!-- الخطوة 3: كلمة مرور جديدة -->
    <div class="step" id="step3">
      <div class="form-group">
        <label for="newPassword">كلمة المرور الجديدة</label>
        <input type="password" id="newPassword" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" placeholder="••••••••">
      </div>
      <button class="btn" id="resetBtn">تغيير كلمة المرور</button>
    </div>
  </div>

<script>
  const API_URL = window.location.origin;
  let currentIdentifier = '';
  let currentCode = '';

  function showError(msg) {
    const e = document.getElementById('errorBox');
    e.textContent = '⚠️ ' + msg; e.classList.add('show');
    document.getElementById('successBox').classList.remove('show');
  }
  function showSuccess(msg) {
    const s = document.getElementById('successBox');
    s.textContent = '✅ ' + msg; s.classList.add('show');
    document.getElementById('errorBox').classList.remove('show');
  }
  function goToStep(step) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step' + step).classList.add('active');
    document.getElementById('errorBox').classList.remove('show');
    document.getElementById('successBox').classList.remove('show');
  }

  // الخطوة 1
  document.getElementById('sendCodeBtn').addEventListener('click', async () => {
    const identifier = document.getElementById('identifier').value.trim();
    if (!identifier) return showError('أدخل البريد أو الهاتف');

    const btn = document.getElementById('sendCodeBtn');
    btn.disabled = true; btn.textContent = 'جاري الإرسال...';

    try {
      const res = await fetch(`${API_URL}/api/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      currentIdentifier = identifier;
      // في بيئة التطوير: نعرض الكود في الـ alert لتسهيل الاختبار
      if (data.codeForTesting) {
        alert(`🔐 (للتطوير فقط) كود التحقق هو: ${data.codeForTesting}`);
      }
      
      showSuccess('تم إرسال الكود');
      setTimeout(() => goToStep(2), 1000);

    } catch (err) {
      showError(err.message);
      btn.disabled = false; btn.textContent = 'إرسال كود التحقق';
    }
  });

  // الخطوة 2
  document.getElementById('verifyBtn').addEventListener('click', async () => {
    const code = document.getElementById('code').value.trim();
    if (code.length !== 6) return showError('الكود يجب أن يكون 6 أرقام');

    const btn = document.getElementById('verifyBtn');
    btn.disabled = true; btn.textContent = 'جاري التحقق...';

    try {
      const res = await fetch(`${API_URL}/api/auth/verify-code`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier: currentIdentifier, code })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      currentCode = code;
      showSuccess('تم التحقق بنجاح');
      setTimeout(() => goToStep(3), 1000);

    } catch (err) {
      showError(err.message);
      btn.disabled = false; btn.textContent = 'التحقق';
    }
  });

  // إعادة الإرسال
  document.getElementById('resendBtn').addEventListener('click', (e) => {
    e.preventDefault();
    goToStep(1);
    document.getElementById('identifier').value = currentIdentifier;
  });

  // الخطوة 3
  document.getElementById('resetBtn').addEventListener('click', async () => {
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;

    if (newPass.length < 6) return showError('كلمة المرور 6 أحرف على الأقل');
    if (newPass !== confirmPass) return showError('كلمتا المرور غير متطابقتين');

    const btn = document.getElementById('resetBtn');
    btn.disabled = true; btn.textContent = 'جاري التغيير...';

    try {
      const res = await fetch(`${API_URL}/api/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          identifier: currentIdentifier, 
          code: currentCode, 
          newPassword: newPass 
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      showSuccess('تم تغيير كلمة المرور!');
      setTimeout(() => window.location.href = '/login.html', 2000);

    } catch (err) {
      showError(err.message);
      btn.disabled = false; btn.textContent = 'تغيير كلمة المرور';
    }
  });
</script>
</body>
</html>
